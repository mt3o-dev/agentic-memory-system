name: release

# Build the install-only-what-you-need assets and attach them to the GitHub
# Release when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
# Bump `version` in pyproject.toml to match the tag before tagging.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact version, not a floating major: setup-uv publishes moving majors only
      # up to v7 while its releases are at v10.x, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          # Matched to the test job: one Node for building and testing the same tree.
          node-version: "24"

      - name: Build the GUI
        run: npm ci && npm run build
        working-directory: gui

      - name: Build wheel + sdist
        run: uv build

      - name: Package GUI + skills tarballs
        run: uv run python scripts/build-assets.py all --version "${GITHUB_REF_NAME#v}"

      - name: List built assets
        run: ls -la dist/

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
