[project]
name = "agentic-memory-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mt3o", email = "teodor.kulej@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    # Upper-bounded deliberately: mcp 2.0 removed the `mcp.server.fastmcp`
    # subpackage this server is built on, so an unbounded constraint installs a
    # broken MCP transport. The repo lockfile hid that — `uv tool install`, pip,
    # and any CI job without the lock resolve fresh and get 2.x. Revisit when the
    # server is ported to the 2.x API.
    "mcp>=1.28.1,<2",
    "pydantic>=2.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
agentic-memory = "agentic_memory_system.cli:main"
agentic-memory-mcp = "agentic_memory_system.mcp_server:main"
agentic-memory-gui = "agentic_memory_system.gui_api:main"

[project.optional-dependencies]
embeddings = [
    "model2vec>=0.3",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
