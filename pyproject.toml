[project]
name = "agentic-memory-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mt3o", email = "teodor.kulej@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.0",
    "mcp>=1.28.1",
    "pydantic>=2.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
agentic-memory-mcp = "agentic_memory_system.mcp_server:main"
agentic-memory-gui = "agentic_memory_system.gui_api:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
